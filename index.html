<title>Nina & Leo | Naše uspomene</title>
<style>
:root{color-scheme:light;--ink:#39332f;--muted:#796f68;--gold:#a48156;--paper:#f7f2ec}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#fffdfa 0%,var(--paper) 75%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:28px 18px}.card{width:min(100%,480px);text-align:center;padding:44px 26px 38px;border:1px solid #d9cbbb;background:#ffffffb8;box-shadow:0 18px 60px #6a4e3012;border-radius:8px}.ornament{font-size:24px;color:var(--gold);letter-spacing:10px;margin-bottom:22px}.eyebrow{font:600 11px/1.6 Arial,sans-serif;letter-spacing:3.5px;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(43px,10vw,66px);font-weight:400;margin:13px 0 12px;letter-spacing:-2px}.line{height:1px;width:80px;background:#c6aa84;margin:20px auto}.intro{font-size:18px;line-height:1.6;margin:0 0 32px}.actions{display:grid;gap:14px}.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:20px 14px;border-radius:5px;text-decoration:none;min-height:96px;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-2px)}.btn strong{font:600 16px Arial,sans-serif;letter-spacing:.3px}.btn small{font:13px Arial,sans-serif}.primary{background:#80694f;color:#fff}.primary:hover{background:#6d583f}.secondary{background:transparent;color:#5d4c3b;border:1px solid #a98d69}.secondary:hover{background:#f5ece0}.note{font:12px/1.7 Arial,sans-serif;color:var(--muted);margin:26px 0 0}.heart{color:#b18475;font-size:22px;margin-top:26px}@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body><main class="card"><div class="ornament" aria-hidden="true">✦</div><div class="eyebrow">Naše vjenčanje</div><h1>Nina <span style="color:#a48156">&</span> Leo</h1><div class="line"></div><p class="intro">Najljepše uspomene nastaju zajedno.<br>Podijelite svoje fotografije s nama!</p><div class="actions"><a class="btn primary" href="https://www.dropbox.com/request/30jj8taznmy16d4wx4gc" target="_blank" rel="noopener noreferrer"><strong>📷 &nbsp; Dodaj fotografije</strong><small>Pošalji fotografije sa svog mobitela</small></a><a class="btn secondary" href="https://www.dropbox.com/scl/fo/zc8b5ydutb92bb1xf0gy2/AJnDdGa8XJZgImglBQ3FMbI?rlkey=cf8vid8wozm74a0t6hypp7bzw&amp;st=hx0n4ny6&amp;dl=0" target="_blank" rel="noopener noreferrer"><strong>♡ &nbsp; Pogledaj galeriju</strong><small>Pregledaj naše zajedničke uspomene</small></a></div><p class="note">Fotografije se učitavaju na Dropbox.<br>Za slanje nije potreban Dropbox račun.</p><div class="heart" aria-hidden="true">♥</div></main></body>
</html>
